<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>✨ 星灵 · 3D 桌面精灵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif;flex-direction:column;gap:10px}
#c{border-radius:16px;cursor:grab;box-shadow:0 0 80px rgba(100,150,255,0.15)}#c:active{cursor:grabbing}
#ui{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
#ui button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:#bbc;padding:5px 13px;border-radius:8px;font-size:11px;cursor:pointer;transition:.3s}
#ui button:hover{background:rgba(150,200,255,0.15);border-color:rgba(150,200,255,0.3)}
#ui button.on{background:rgba(100,180,255,0.2);border-color:#6af;color:#ddf}
#info{color:rgba(255,255,255,0.4);font-size:11px;letter-spacing:0.5px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="info">🖱 拖拽旋转 · ✨ 200MB 全 3D 渲染</div>
<script>
const W=480,H=520;
const c=document.getElementById('c'),ctx=c.getContext('2d');
c.width=W;c.height=H;

// ===== 3D 引擎 =====
let angle=0.3, pitch=0.15, time=0;
let mouseX=0,mouseY=0,md=false,lmx=0,lmy=0;

function rotY(x,y,z,a){
    return [x*Math.cos(a)+z*Math.sin(a), y, -x*Math.sin(a)+z*Math.cos(a)];
}
function rotX(x,y,z,a){
    return [x, y*Math.cos(a)-z*Math.sin(a), y*Math.sin(a)+z*Math.cos(a)];
}
function proj(x,y,z){
    const d=z+6,f=320/(z+6);
    return [x*f+W/2, -y*f+H/2, f];
}

// ===== 颜色 =====
const pal={
    body:[[80,160,255],[140,100,255],[255,120,200]],
    glow:[[60,180,255],[200,130,255],[255,150,200]],
    eye:[[255,255,255],[180,220,255]],
    core:[[255,255,255],[200,220,255]],
    star:[[255,240,200],[200,220,255],[255,200,150]],
};

// ===== 星灵 =====
const bodyRadius=0.6;
let anim=0,animTime=0;

// 身体球体
function drawBody(px,py,pz,r,color1,color2,sf){
    const grad=ctx.createRadialGradient(
        px-sf*0.2*r, py-sf*0.3*r, 0, px, py, r*2.2);
    grad.addColorStop(0,`rgba(${color1[0]+80},${color1[1]+80},${color1[2]+80},1)`);
    grad.addColorStop(0.3,`rgba(${color1[0]},${color1[1]},${color1[2]},0.95)`);
    grad.addColorStop(0.7,`rgba(${color2[0]},${color2[1]},${color2[2]},0.7)`);
    grad.addColorStop(1,`rgba(${color2[0]-40},${color2[1]-40},${color2[2]-40},0.2)`);
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.ellipse(px,py,r*2.2,r*2,0,0,Math.PI*2);ctx.fill();
}

// 发光外圈
function drawGlow(px,py,r,color,sf){
    const grad=ctx.createRadialGradient(px,py,0,px,py,r*3);
    grad.addColorStop(0,`rgba(${color[0]},${color[1]},${color[2]},0.15)`);
    grad.addColorStop(0.5,`rgba(${color[0]},${color[1]},${color[2]},0.05)`);
    grad.addColorStop(1,`rgba(${color[0]},${color[1]},${color[2]},0)`);
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(px,py,r*4,0,Math.PI*2);ctx.fill();
}

// 眼睛
function drawEyes(px,py,pz,sf,blink){
    const eyeW=0.13,eyeH=0.15;
    for(let s of[-1,1]){
        const [ex,ey,ef]=proj(px+s*0.18,py+0.05,pz+0.35);
        const ew=eyeW*ef*1.8,eh=eyeH*ef*(blink?0.1:1.8);
        // 眼白发光
        const g=ctx.createRadialGradient(ex,ey,0,ex,ey,ew);
        g.addColorStop(0,'rgba(220,240,255,0.95)');
        g.addColorStop(1,'rgba(180,210,255,0.3)');
        ctx.fillStyle=g;
        ctx.beginPath();ctx.ellipse(ex,ey,ew,eh*0.8,0,0,Math.PI*2);ctx.fill();
        // 瞳孔
        if(!blink){
            const pw=ew*0.5,ph=eh*0.6;
            const g2=ctx.createRadialGradient(ex-1,ey-1,0,ex,ey,pw);
            g2.addColorStop(0,'rgba(40,60,120,1)');
            g2.addColorStop(1,'rgba(20,30,80,1)');
            ctx.fillStyle=g2;
            ctx.beginPath();ctx.ellipse(ex,ey,pw,ph*1.2,0,0,Math.PI*2);ctx.fill();
            // 高光
            ctx.fillStyle='rgba(255,255,255,0.9)';
            ctx.beginPath();ctx.arc(ex-pw*0.3,ey-ph*0.3,pw*0.35,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='rgba(255,255,255,0.5)';
            ctx.beginPath();ctx.arc(ex+pw*0.2,ey+ph*0.1,pw*0.15,0,Math.PI*2);ctx.fill();
        }
    }
}

// 粒子
const particles=[];
for(let i=0;i<30;i++){
    particles.push({
        x:(Math.random()-0.5)*2.5,y:Math.random()*2-0.5,z:(Math.random()-0.5)*2.5,
        vx:(Math.random()-0.5)*0.3,vy:0.05+Math.random()*0.15,vz:(Math.random()-0.5)*0.3,
        life:Math.random(),maxLife:0.5+Math.random()*1.5,phase:Math.random()*6,
        size:0.01+Math.random()*0.02,color:pal.star[Math.floor(Math.random()*3)]
    });
}

// 星尾粒子 (跟随)
const tailParticles=[];
for(let i=0;i<15;i++){
    tailParticles.push({off:i/15*0.5,size:0.015+Math.random()*0.015});
}

// ===== 绘制 =====
function draw(){
    const dt=0.016;time+=dt;animTime+=dt;
    ctx.clearRect(0,0,W,H);
    
    // 深空背景
    const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,400);
    bg.addColorStop(0,'#0a0a2e');bg.addColorStop(0.5,'#060618');bg.addColorStop(1,'#020208');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    
    // 星星背景
    for(let i=0;i<50;i++){
        const sx=(i*137.5)%W,sy=(i*223.7)%H;
        const tw=Math.sin(time*0.5+i)*0.5+0.5;
        ctx.fillStyle=`rgba(255,255,255,${tw*0.4})`;
        ctx.fillRect(sx,sy,1+tw,1+tw);
    }

    // ===== 星灵 =====
    // 动作
    let bodyBounce=0,bodyTilt=0,bodyScale=1,headTilt=0;
    let colorIdx=0;
    switch(anim){
        case 0:// 漂浮
            bodyBounce=Math.sin(time*1.2)*0.06;
            bodyTilt=Math.sin(time*0.6)*0.03;
            colorIdx=Math.floor(time*0.3)%3;
            break;
        case 1:// 开心
            bodyBounce=Math.abs(Math.sin(time*4))*0.15;
            bodyTilt=Math.sin(time*4)*0.05;
            bodyScale=1+Math.sin(time*4)*0.03;
            colorIdx=2;
            break;
        case 2:// 好奇
            headTilt=Math.sin(time*2)*0.15;
            bodyTilt=Math.sin(time*1.5)*0.02;
            colorIdx=1;
            break;
        case 3:// 睡觉
            bodyBounce=Math.sin(time*0.5)*0.03;
            bodyScale=0.85;
            colorIdx=0;
            break;
        case 4:// 旋转
            angle+=dt*2;
            bodyTilt=Math.sin(time*3)*0.08;
            colorIdx=Math.floor(time*0.5)%3;
            break;
        case 5:// 绽放
            bodyScale=0.9+Math.sin(time*2)*0.05;
            bodyBounce=Math.sin(time*3)*0.04;
            colorIdx=Math.floor(time*0.4)%3;
            break;
    }

    // 3D变换
    let cx=0,cy=0.2+bodyBounce,cz=0;
    [cx,cy,cz]=rotY(cx,cy,cz,angle);
    [cx,cy,cz]=rotX(cx,cy,cz,pitch+bodyTilt);
    const [bx,by,bf]=proj(cx,cy,cz);
    
    const baseColor=pal.body[colorIdx];
    const glowColor=pal.glow[colorIdx];
    const r=bodyRadius*bodyScale;

    // 发光外圈
    drawGlow(bx,by,r*bf,glowColor,bf);
    // 身体
    drawBody(bx,by,r*bf,r,baseColor,glowColor,bf);

    // 眼睛 (在身体表面)
    drawEyes(cx,cy,cz,bf,anim===3);

    // 小星星耳朵
    for(let s of[-1,1]){
        const [ex,ey,ef]=rotY(cx+s*0.3,cy+0.35,cz,0);
        const [ex2,ey2]=proj(ex,ey,cz-0.05);
        const earSize=0.08*ef;
        const grad=ctx.createRadialGradient(ex2,ey2,0,ex2,ey2,earSize*2);
        grad.addColorStop(0,`rgba(${glowColor[0]},${glowColor[1]},${glowColor[2]},0.5)`);
        grad.addColorStop(1,`rgba(${glowColor[0]},${glowColor[1]},${glowColor[2]},0)`);
        ctx.fillStyle=grad;
        ctx.beginPath();ctx.ellipse(ex2,ey2-earSize,earSize*0.5,earSize*2,Math.sin(time+s)*0.2,0,Math.PI*2);ctx.fill();
    }

    // 彗星尾巴
    for(let i=0;i<tailParticles.length;i++){
        const tp=tailParticles[i];
        const tt=time-tp.off;
        const tx=Math.sin(tt*1.5)*0.5*Math.cos(angle+tt*0.5);
        const ty=0.2-Math.abs(Math.sin(tt*0.8))*0.3+bodyBounce;
        const tz=Math.cos(tt*1.5)*0.5*Math.cos(angle+tt*0.5)-0.8;
        let [ttx,tty,ttf]=proj(tx,ty,tz);
        const alpha=(1-i/15)*0.3;
        const ts=tp.size*ttf;
        ctx.fillStyle=`rgba(${glowColor[0]},${glowColor[1]},${glowColor[2]},${alpha})`;
        ctx.beginPath();ctx.arc(ttx,tty,ts,0,Math.PI*2);ctx.fill();
    }

    // 粒子系统
    for(const p of particles){
        p.x+=p.vx*dt*20;p.y+=p.vy*dt*20;p.z+=p.vz*dt*20;
        p.life+=dt;
        if(p.life>p.maxLife){
            p.x=(Math.random()-0.5)*3;
            p.y=Math.random()*1.5-0.5;
            p.z=(Math.random()-0.5)*3;
            p.life=0;
        }
        const alpha=1-p.life/p.maxLife;
        const [ppx,ppy,ppf]=proj(p.x,p.y+Math.sin(time+p.phase)*0.2,p.z);
        const ps=p.size*ppf;
        ctx.fillStyle=`rgba(${p.color[0]},${p.color[1]},${p.color[2]},${alpha*0.4})`;
        ctx.beginPath();ctx.arc(ppx,ppy,ps,0,Math.PI*2);ctx.fill();
    }

    requestAnimationFrame(draw);
}

// ===== UI =====
['✨ 漂浮','🌟 开心','👀 好奇','💤 睡觉','🌀 旋转','🌈 绽放'].forEach((t,i)=>{
    const b=document.createElement('button');
    b.textContent=t;b.className=i===0?'on':'';
    b.onclick=()=>{
        document.querySelectorAll('#ui button').forEach(x=>x.className='');
        b.className='on';anim=i;animTime=0;
    };
    document.getElementById('ui').appendChild(b);
});

// 鼠标
c.addEventListener('mousedown',e=>{md=true;lmx=e.clientX;lmy=e.clientY;});
window.addEventListener('mousemove',e=>{
    if(!md)return;
    const dx=e.clientX-lmx,dy=e.clientY-lmy;
    angle+=dx*0.008;pitch=Math.max(-0.5,Math.min(0.8,pitch+dy*0.005));
    lmx=e.clientX;lmy=e.clientY;
});
window.addEventListener('mouseup',()=>md=false);
c.addEventListener('touchstart',e=>{md=true;lmx=e.touches[0].clientX;lmy=e.touches[0].clientY;});
c.addEventListener('touchmove',e=>{
    if(!md||!e.touches[0])return;
    const dx=e.touches[0].clientX-lmx,dy=e.touches[0].clientY-lmy;
    angle+=dx*0.008;pitch=Math.max(-0.5,Math.min(0.8,pitch+dy*0.005));
    lmx=e.touches[0].clientX;lmy=e.touches[0].clientY;
});
c.addEventListener('touchend',()=>md=false);

draw();
</script>
</body>
</html>
